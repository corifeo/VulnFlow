[project]
name = "vulnflow"
version = "0.1.0"
description = "ETL pipeline for public vulnerability data: NVD, KEV, EPSS, CWE, CAPEC and MSRC into pandas, polars and Parquet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francesco Manzoni", email = "francesco.manzoni@outlook.com" }]
keywords = ["vulnerability", "security", "etl", "cve", "nvd", "cvd", "kev", "epss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Typing :: Typed",
]

dependencies = [
    "numpy>=1.26.0",
    "orjson>=3.10.0",
    "polars>=0.20.0",
    "pandas>=2.0.0",
    "httpx>=0.27.0",
    "pyarrow>=15.0.0",
    "tqdm>=4.67.3",
    "nest-asyncio>=1.6.0",
]

[project.optional-dependencies]
notebook = [
    "ipywidgets>=8.1.8",
    "matplotlib>=3.10.8",
    "jupyterlab>=4.0.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/corifeo/vulnflow"
Documentation = "https://github.com/corifeo/vulnflow#readme"
Repository = "https://github.com/corifeo/vulnflow.git"
"Bug Tracker" = "https://github.com/corifeo/vulnflow/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnflow"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["polars.*", "pyarrow.*", "IPython.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v -m 'not slow'"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[dependency-groups]
dev = [
    "black>=26.1.0",
    "mypy>=1.19.1",
    "pandas-stubs>=2.3.3.260113",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.14",
    "types-tqdm>=4.67.2.20260202",
]

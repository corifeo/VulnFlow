<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">vulnflow pipeline</title>
  <desc id="d">Public feeds are extracted into one columnar dataset, enriched, inferred and computed, then loaded into pandas, polars, Parquet or JSON.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; }
    .core { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.6; }
    .h { font-size: 15px; font-weight: 600; fill: #1f2328; }
    .t { font-size: 13px; fill: #424a53; }
    .a { stroke: #8c959f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .ah { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #6e7681; }
      .core { fill: #0c2d6b; stroke: #4493f8; }
      .h { fill: #e6edf3; }
      .t { fill: #9198a1; }
      .a { stroke: #6e7681; }
      .ah { fill: #6e7681; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="ah" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>

  <rect class="box" x="10" y="20" width="200" height="260" rx="10"/>
  <text class="h" x="30" y="50">Extract</text>
  <text class="t" x="30" y="80">NVD JSON feeds</text>
  <text class="t" x="30" y="104">NVD REST API 2.0</text>
  <text class="t" x="30" y="128">MSRC Patch Tuesday</text>
  <text class="t" x="30" y="152">Parquet · JSON</text>
  <text class="t" x="30" y="176">pandas · polars</text>

  <path class="a" d="M214,150 L262,150"/>

  <rect class="core" x="266" y="20" width="350" height="260" rx="10"/>
  <text class="h" x="286" y="50">Transform (dependency-ordered)</text>
  <text class="t" x="286" y="80">Enrich: CISA KEV · EPSS · CWE · CAPEC</text>
  <text class="t" x="286" y="104">            NVD change history</text>
  <text class="t" x="286" y="134">Flatten: CVSS · CPE · CWE · KEV · EPSS</text>
  <text class="t" x="286" y="164">Infer: CVD events · tags · STRIDE</text>
  <text class="t" x="286" y="194">Compute: CVD state · zero-day flags</text>
  <text class="t" x="286" y="218">                 · desiderata · time deltas</text>
  <text class="t" x="286" y="256">One columnar dataset (NumPy arrays)</text>

  <path class="a" d="M620,150 L668,150"/>

  <rect class="box" x="672" y="20" width="198" height="260" rx="10"/>
  <text class="h" x="692" y="50">Load</text>
  <text class="t" x="692" y="80">pandas</text>
  <text class="t" x="692" y="104">polars</text>
  <text class="t" x="692" y="128">Parquet</text>
  <text class="t" x="692" y="152">JSON</text>
</svg>
